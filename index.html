<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الاتصال المجاني</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        input {
            width: 85%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        button.reject {
            background: #dc2626;
        }
        .hidden { display: none !important; }
        #my-id { color: #38bdf8; font-weight: bold; font-size: 18px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card" id="main-screen">
        <h2>أداة الاتصال المجاني</h2>
        <p>اليوزر الثابت الخاص بك:</p>
        <div id="my-id">جاري التوليد...</div>
        
        <hr style="border-color: #334155; margin: 20px 0;">
        
        <p>اتصل بشخص آخر:</p>
        <input type="text" id="target-input" placeholder="أدخل يوزر الشخص الآخر">
        <button onclick="startCall()">اتصال الآن</button>
    </div>

    <!-- شاشة المكالمة الواردة -->
    <div class="card hidden" id="incoming-screen">
        <h2>مكالمة واردة...</h2>
        <p id="caller-id"></p>
        <audio id="ringtone" loop src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg"></audio>
        <button onclick="acceptCall()">قبول المكالمة</button>
        <button class="reject" onclick="rejectCall()">رفض</button>
    </div>

    <!-- شاشة المكالمة الجارية -->
    <div class="card hidden" id="call-screen">
        <h2>متصل الآن</h2>
        <p id="call-status">جاري التحدث...</p>
        <audio id="remote-audio" autoplay></audio>
        <button class="reject" onclick="endCall()">إنهاء المكالمة</button>
    </div>

    <!-- مكتبة Socket.io و Simple-Peer للاتصال الصوتي المباشر -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script>
        const socket = io();
        let myUsername, peer, incomingSignal, callerSocketId;

        if (!localStorage.getItem('call_user_id')) {
            myUsername = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('call_user_id', myUsername);
        } else {
            myUsername = localStorage.getItem('call_user_id');
        }

        document.getElementById('my-id').innerText = myUsername;
        socket.emit('register-user', myUsername);

        document.body.addEventListener('click', () => {
            const audio = document.getElementById('ringtone');
            audio.play().then(() => audio.pause()).catch(() => {});
        }, { once: true });

        function startCall() {
            const targetUser = document.getElementById('target-input').value.trim();
            if (!targetUser) return alert('الرجاء إدخال يوزر صحيح');

            document.getElementById('call-status').innerText = 'جاري الاتصال بـ ' + targetUser + '...';
            switchScreen('call-screen');

            peer = new SimplePeer({ initiator: true, trickle: false });

            peer.on('signal', data => {
                socket.emit('call-user', { fromUser: myUsername, targetUser: targetUser, signal: data });
            });

            peer.on('stream', stream => {
                document.getElementById('remote-audio').srcObject = stream;
            });
        }

        socket.on('incoming-call', (data) => {
            incomingSignal = data.signal;
            callerSocketId = data.from;
            document.getElementById('caller-id').innerText = 'المتصل: ' + data.from;
            document.getElementById('ringtone').play();
            switchScreen('incoming-screen');
        });

        function acceptCall() {
            document.getElementById('ringtone').pause();
            switchScreen('call-screen');

            peer = new SimplePeer({ initiator: false, trickle: false });

            peer.on('signal', data => {
                socket.emit('accept-call', { toUser: callerSocketId, signal: data });
            });

            peer.on('stream', stream => {
                document.getElementById('remote-audio').srcObject = stream;
            });

            peer.signal(incomingSignal);
        }

        socket.on('call-accepted', signal => {
            peer.signal(signal);
        });

        function rejectCall() {
            document.getElementById('ringtone').pause();
            socket.emit('reject-call', { toUser: callerSocketId });
            switchScreen('main-screen');
        }

        socket.on('call-rejected', () => {
            alert('تم رفض المكالمة');
            endCall();
        });

        function endCall() {
            if (peer) peer.destroy();
            document.getElementById('ringtone').pause();
            switchScreen('main-screen');
        }

        function switchScreen(screenId) {
            ['main-screen', 'incoming-screen', 'call-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }
    </script>
</body>
</html>
